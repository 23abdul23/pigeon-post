AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pigeon Post - static site (S3 + CloudFront) and serverless API

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth client ID (not secret)
  # CloudFormation cannot resolve ssm-secure for Cognito IdP, so the deploy command passes the secret in from SSM, e.g.
  #   sam deploy --parameter-overrides GoogleClientId=<id> SesSenderEmail=<verified sender or ''> GoogleClientSecret=$(aws ssm get-parameter --name /pigeon/google-client-secret --with-decryption --query Parameter.Value --output text --profile pigeon)
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth client secret, read from SSM /pigeon/google-client-secret at deploy time
  # SES is optional. Empty (default) disables "A letter arrived" emails and drops the ses:SendEmail permission.
  # `sam deploy` keeps previous values for omitted parameters, so pass SesSenderEmail=<sender or ''> every time.
  # While the account is in the SES sandbox only verified recipient addresses receive mail, and ses:SendEmail may then
  # also need their identity ARNs as resources.
  SesSenderEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+$'
    Description: Optional SES-verified sender address for "A letter arrived" emails (empty = email alerts off)

  # Confirm this id in the Bedrock console (model access granted in Task 0); the "us." prefix is a cross-region inference profile.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    AllowedPattern: '^us\.anthropic\..+'
    Description: Bedrock inference profile id used for story polish

  # Optional custom domain (Task 10). Leave Domain empty to serve from the CloudFront domain only.
  Domain:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    Description: Custom site domain, e.g. pigeonpost.app (empty = none)
  # With a Route 53 zone the certificate is validated and the alias records are created in-stack.
  # Without one, the stack waits at the certificate until you add the ACM validation CNAME at your DNS host
  # (see docs/runbook.md), then you add the alias to the CloudFront domain yourself.
  HostedZoneId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^Z[A-Z0-9]+$'
    Description: Route 53 hosted zone id for Domain (empty = DNS managed elsewhere)
  # ARN of the pigeon-post-lambda-boundary policy from deploy-role.yaml. Empty for manual admin deploys; the CI deploy
  # role may only create Lambda roles that carry this boundary, so CI must pass it.
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:iam::[0-9]{12}:policy/.+$'
    Description: IAM permissions boundary for the Lambda execution roles (empty = none)

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, '']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  HasDomainAndZone: !And [!Condition HasDomain, !Condition HasHostedZone]
  HasSesSender: !Not [!Equals [!Ref SesSenderEmail, '']]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Globals:
  Function:
    PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref PigeonPost

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront only accepts certificates from us-east-1, which is this stack's region (Global Constraints).
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref Domain
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - [{ DomainName: !Ref Domain, HostedZoneId: !Ref HostedZoneId }]
        - !Ref 'AWS::NoValue'

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: !If [HasDomain, [!Ref Domain], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref SiteCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref 'AWS::NoValue'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        # SPA deep links: private bucket returns 403 for missing keys
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # Z2FDTNDATAQYW2 is the fixed hosted zone id of every CloudFront distribution.
  SiteAliasA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomainAndZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: A
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt SiteDistribution.DomainName }

  SiteAliasAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomainAndZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: AAAA
      AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt SiteDistribution.DomainName }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - { Name: email, Required: true, Mutable: true }

  GoogleIdp:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name
        username: sub

  # Hosted UI domain prefix must be globally unique per region: stack name + account id.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdp
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub 'https://${SiteDistribution.DomainName}/auth/callback'
        - http://localhost:5173/auth/callback
        - !If [HasDomain, !Sub 'https://${Domain}/auth/callback', !Ref 'AWS::NoValue']
      LogoutURLs:
        - !Sub 'https://${SiteDistribution.DomainName}/signin'
        - http://localhost:5173/signin
        - !If [HasDomain, !Sub 'https://${Domain}/signin', !Ref 'AWS::NoValue']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]
            IdentitySource: $request.header.Authorization
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${SiteDistribution.DomainName}'
          - http://localhost:5173
          - !If [HasDomain, !Sub 'https://${Domain}', !Ref 'AWS::NoValue']
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600

  # Single table (API contract): PK/SK per user, GSI1 for invite-code lookup, TTL on `ttl`.
  PigeonPost:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-health'
      RetentionInDays: 14

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/health.ts]
    Properties:
      CodeUri: api/
      Handler: health.handler
      LoggingConfig:
        LogGroup: !Ref HealthLogGroup
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health
            Auth:
              Authorizer: NONE

  StateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-state'
      RetentionInDays: 14

  StateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/state.ts]
    Properties:
      CodeUri: api/
      Handler: state.handler
      LoggingConfig:
        LogGroup: !Ref StateLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt PigeonPost.Arn
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /state

  MeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-me'
      RetentionInDays: 14

  MeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/me.ts]
    Properties:
      CodeUri: api/
      Handler: me.handler
      LoggingConfig:
        LogGroup: !Ref MeLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt PigeonPost.Arn
            - Effect: Allow
              Action: [dynamodb:Query] # invite-code collision check
              Resource: !Sub '${PigeonPost.Arn}/index/GSI1'
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /me

  CreateTripLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-create-trip'
      RetentionInDays: 14

  CreateTripFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/trips.ts]
    Properties:
      CodeUri: api/
      Handler: trips.createTrip
      LoggingConfig:
        LogGroup: !Ref CreateTripLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt PigeonPost.Arn
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /trips

  # Transaction: session/trip/stamp/story are Puts, arrival letter moves are Updates; reads check idempotency, the trip and the stamp.
  SessionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-sessions'
      RetentionInDays: 14

  SessionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/sessions.ts]
    Properties:
      CodeUri: api/
      Handler: sessions.handler
      LoggingConfig:
        LogGroup: !Ref SessionsLogGroup
      Environment:
        Variables:
          SES_SENDER: !Ref SesSenderEmail
      Policies:
        - Statement:
            # Query + UpdateItem: the arrival step reads my letters and moves both copies (mine and my friend's)
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource: !GetAtt PigeonPost.Arn
            # "A letter arrived" email, from the verified sender only (the recipient's email is read from their profile row)
            - !If
              - HasSesSender
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSenderEmail}'
              - !Ref AWS::NoValue
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /trips/{id}/sessions

  ReturnTripLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-return-trip'
      RetentionInDays: 14

  ReturnTripFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/trips.ts]
    Properties:
      CodeUri: api/
      Handler: trips.returnTrip
      LoggingConfig:
        LogGroup: !Ref ReturnTripLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:GetItem]
              Resource: !GetAtt PigeonPost.Arn
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /trips/{id}/return

  StoriesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-stories'
      RetentionInDays: 14

  StoriesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/stories.ts]
    Properties:
      CodeUri: api/
      Handler: stories.handler
      LoggingConfig:
        LogGroup: !Ref StoriesLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt PigeonPost.Arn
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /stories/{id}

  ComposeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-compose'
      RetentionInDays: 14

  ComposeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/compose.ts]
    Properties:
      CodeUri: api/
      Handler: compose.handler
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref ComposeLogGroup
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt PigeonPost.Arn
            # Only this model: the inference profile, plus the foundation model it routes to (the profile id minus "us.").
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}'
                - !Sub
                  - 'arn:${AWS::Partition}:bedrock:*::foundation-model/${Base}'
                  - Base: !Select [1, !Split ['us.', !Ref BedrockModelId]]
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /stories/compose

  FriendsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-friends'
      RetentionInDays: 14

  # One function for the four friend routes; they share the same permissions (TransactWriteItems needs the per-item actions).
  FriendsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/friends.ts]
    Properties:
      CodeUri: api/
      Handler: friends.handler
      LoggingConfig:
        LogGroup: !Ref FriendsLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt PigeonPost.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub '${PigeonPost.Arn}/index/GSI1'
      Events:
        Request:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /friends/request }
        Accept:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/friends/{id}/accept' }
        Decline:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/friends/{id}/decline' }
        Remove:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: '/friends/{id}' }

  # Letter attachments. Private: the browser uploads and downloads only through 5-minute presigned URLs.
  LettersBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub 'https://${SiteDistribution.DomainName}'
              - http://localhost:5173
              - !If [HasDomain, !Sub 'https://${Domain}', !Ref 'AWS::NoValue']
            AllowedMethods: [PUT, GET]
            AllowedHeaders: [content-type]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  LettersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-letters'
      RetentionInDays: 14

  # One function for the three letter routes. Writes touch both users' partitions in one transaction.
  LettersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/letters.ts]
    Properties:
      CodeUri: api/
      Handler: letters.handler
      LoggingConfig:
        LogGroup: !Ref LettersLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt PigeonPost.Arn
      Events:
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /letters }
        Open:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/letters/{id}/open' }
        Save:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: '/letters/{id}' }

  UploadsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-uploads'
      RetentionInDays: 14

  UploadsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/uploads.ts]
    Properties:
      CodeUri: api/
      Handler: uploads.handler
      LoggingConfig:
        LogGroup: !Ref UploadsLogGroup
      Environment:
        Variables:
          LETTERS_BUCKET: !Ref LettersBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query] # may this caller read an attachment: is it on a letter in their inbox?
              Resource: !GetAtt PigeonPost.Arn
            # presigned URLs act with these rights, so they cover letters/* only
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub '${LettersBucket.Arn}/letters/*'
      Events:
        Presign:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /uploads/presign }
        Url:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /uploads/url }

  AccountLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-account'
      RetentionInDays: 14

  # DELETE /me: my rows, my friends' rows about me, in-flight letter copies, my attachments and my Cognito user.
  AccountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        OutExtension: [.js=.mjs]
        Banner: ["js=import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"]
        EntryPoints: [src/handlers/account.ts]
    Properties:
      CodeUri: api/
      Handler: account.handler
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref AccountLogGroup
      Environment:
        Variables:
          LETTERS_BUCKET: !Ref LettersBucket
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
              Resource: !GetAtt PigeonPost.Arn
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !GetAtt LettersBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: ['letters/*']
            - Effect: Allow
              Action: [s3:DeleteObject] # DeleteObjects checks this per key
              Resource: !Sub '${LettersBucket.Arn}/letters/*'
            - Effect: Allow
              Action: [cognito-idp:AdminDeleteUser]
              Resource: !GetAtt UserPool.Arn
      Events:
        Route:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /me

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API 5xx responses above 5 in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${Domain}', !Sub 'https://${SiteDistribution.DomainName}']
  # Point DNS here (CNAME/ALIAS) when HostedZoneId is empty.
  CloudFrontDomain:
    Value: !GetAtt SiteDistribution.DomainName
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SiteBucket:
    Value: !Ref SiteBucket
  LettersBucket:
    Value: !Ref LettersBucket
  DistributionId:
    Value: !Ref SiteDistribution
  UserPoolId:
    Value: !Ref UserPool
  TableName:
    Value: !Ref PigeonPost
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  # Add this exact URI to the Google OAuth client's "Authorized redirect URIs"
  GoogleRedirectUri:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse'
