name: ci-deploy

# Pull requests run tests only (no AWS credentials). Pushes to main test, then deploy.
# Third-party actions are pinned by major version tag; pinning to a full commit SHA is a further hardening step.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm --prefix api ci
      - run: npm --prefix api test
      - run: npx tsc -b

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for the deploy role; no stored AWS keys
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false # never kill a deploy half way; queue the next one
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm --prefix api ci
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pigeon-post-deploy
      - name: Build
        # esbuild is an api/ devDependency; SAM only finds it on PATH.
        run: |
          echo "$GITHUB_WORKSPACE/api/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/api/node_modules/.bin:$PATH"
          sam build --config-env ci
      - name: Smoke-test bundles
        # A handler that fails to import crashes at Lambda init; block the deploy.
        run: node scripts/smoke-bundles.mjs
      - name: Deploy stack
        # Values come in through env, never interpolated into the script text.
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          DOMAIN: ${{ vars.DOMAIN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.AWS_PERMISSIONS_BOUNDARY_ARN }}
        run: |
          set -euo pipefail
          # CloudFormation cannot read ssm-secure for the Cognito Google IdP, so the secret travels as a NoEcho
          # parameter. It is masked in logs and never stored in GitHub. Tradeoff: it is briefly in this process's argv.
          secret="$(aws ssm get-parameter --name /pigeon/google-client-secret --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::${secret}"
          # SES is optional (template default '' = email alerts off). sam deploy rejects an empty override value ("SesSenderEmail=" is
          # not a valid format), so it is only passed when set. Omitted parameters keep their previous value, so to switch SES OFF after
          # it was on, run one local deploy with the stack parameter cleared (see docs/runbook.md).
          overrides=("GoogleClientId=${GOOGLE_CLIENT_ID}" "GoogleClientSecret=${secret}")
          [ -n "${SES_SENDER_EMAIL}" ] && overrides+=("SesSenderEmail=${SES_SENDER_EMAIL}")
          [ -n "${BEDROCK_MODEL_ID}" ] && overrides+=("BedrockModelId=${BEDROCK_MODEL_ID}")
          [ -n "${DOMAIN}" ] && overrides+=("Domain=${DOMAIN}")
          [ -n "${HOSTED_ZONE_ID}" ] && overrides+=("HostedZoneId=${HOSTED_ZONE_ID}")
          [ -n "${PERMISSIONS_BOUNDARY_ARN}" ] && overrides+=("PermissionsBoundaryArn=${PERMISSIONS_BOUNDARY_ARN}")
          sam deploy --config-env ci --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "${overrides[@]}"
      - name: Publish site
        run: node scripts/deploy-web.mjs
