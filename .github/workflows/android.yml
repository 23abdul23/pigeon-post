name: android-release

# Builds a signed App Bundle and uploads it to the Google Play INTERNAL track only.
# Promotion to closed or production is manual in the Play Console (docs/android-release.md).
# Third-party actions are pinned by major version tag, as in deploy.yml.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false # never kill an upload half way; queue the next release

jobs:
  release:
    # Manual runs only from main; tag runs only from android-v* tags. Never ship a feature branch.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8 compiles with JavaVersion.VERSION_21
      - name: Install web dependencies
        run: npm ci
      - name: Web tests
        run: npx vitest run
      - name: Install API dependencies
        run: npm --prefix api ci
      - name: API tests
        run: npm --prefix api test
      - name: Type check
        run: npx tsc -b
      - name: Check build configuration
        # An unset repository variable expands to "" and overrides .env.production, which would ship an app that silently
        # runs on the offline mock user. Fail instead. Only variable NAMES are printed, never values.
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUSH_ENABLED: ${{ vars.VITE_PUSH_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          bad=0
          for name in VITE_COGNITO_USER_POOL_ID VITE_COGNITO_CLIENT_ID VITE_COGNITO_DOMAIN VITE_API_URL; do
            value="${!name:-}"
            if [ -z "$value" ] || [[ "$value" == *REPLACE_ME* ]]; then
              echo "::error::Repository variable $name is empty or still a REPLACE_ME placeholder"
              bad=1
            fi
          done
          if [ "${VITE_PUSH_ENABLED:-false}" = "true" ] && [ ! -f android/app/google-services.json ]; then
            echo "::error::VITE_PUSH_ENABLED is true but android/app/google-services.json is missing"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
      - name: Build web bundle
        # Non-secret repository variables, passed through env, never interpolated into the script text.
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUSH_ENABLED: ${{ vars.VITE_PUSH_ENABLED || 'false' }}
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Check signing and upload secrets are set
        # An unset secret expands to an empty string; fail here instead of building an unsigned bundle.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not set}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not set}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is not set}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not set}"
          : "${PLAY_SERVICE_ACCOUNT_JSON:?PLAY_SERVICE_ACCOUNT_JSON is not set}"
      - name: Compute version name
        # Tag runs strip the android-v prefix; manual runs use the default.
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then v="${REF_NAME#android-v}"; else v="1.0"; fi
          # Validate before writing to GITHUB_ENV: a newline or odd character in a tag must not inject env lines.
          if [ -z "$v" ] || ! [[ "$v" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Tag does not give a valid version name (allowed: 0-9 A-Z a-z . _ -)"
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"
          chmod 600 "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.pigeonpost
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          # First releases of a new Play app must be drafts until the store listing is complete.
          # Change to "completed" once the listing is approved (docs/android-release.md).
          status: draft
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
